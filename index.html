<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>コースメニュー</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<meta name="mobile-web-app-capable" content="yes">

<style>
*{box-sizing:border-box}

body{
  font-family:sans-serif;
  margin:0;
  padding:10px;
  background:#fff;
  color:#222
}

.box{
  max-width:600px;
  margin:auto
}

h1{
  font-size:20px;
  text-align:center;
  margin:5px 0 10px
}

h2{
  font-size:16px;
  margin:18px 0 8px;
  border-bottom:1px solid #ddd;
  padding-bottom:5px
}

.search-box{
  width:100%;
  height:38px;
  padding:6px 10px;
  border:1px solid #bbb;
  border-radius:3px;
  font-size:14px;
  margin-bottom:12px
}

.info-row{
  display:flex;
  align-items:center;
  margin-bottom:7px
}

.info-label{
  width:105px;
  font-size:14px;
  flex-shrink:0
}

.info-input{
  flex:1;
  min-width:0;
  height:38px;
  padding:6px 8px;
  border:1px solid #bbb;
  border-radius:3px;
  font-size:15px
}

.food{
  margin-bottom:6px
}

.food-row{
  display:flex;
  align-items:center;
  gap:6px
}

.food-number{
  width:22px;
  font-size:14px;
  text-align:right;
  flex-shrink:0
}

.food-name{
  flex:1;
  min-width:0;
  height:36px;
  padding:5px 7px;
  border:1px solid #bbb;
  border-radius:3px;
  font-size:15px
}

.food-price{
  width:80px;
  height:36px;
  padding:5px;
  border:1px solid #bbb;
  border-radius:3px;
  font-size:15px;
  text-align:right;
  flex-shrink:0
}

button{
  border:0;
  border-radius:3px;
  cursor:pointer
}

.delete{
  width:45px;
  height:36px;
  background:#eee;
  color:#555;
  font-size:12px;
  flex-shrink:0
}

.insert{
  width:36px;
  height:36px;
  background:#ddd;
  color:#333;
  font-size:16px;
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  justify-content:center
}

.main-button{
  width:100%;
  height:38px;
  margin-top:8px;
  background:#333;
  color:white;
  font-size:14px
}

.save{
  background:#555
}

.button-group{
  display:flex;
  gap:8px;
  margin-top:8px
}

.button-group .main-button{
  margin-top:0
}

.total{
  margin-top:12px;
  padding:10px;
  border:1px solid #ccc;
  background:#f7f7f7;
  text-align:right;
  font-size:18px;
  font-weight:bold
}

.result{
  margin-top:15px;
  padding:10px;
  border:1px solid #ddd;
  font-size:14px;
  line-height:1.7
}


/* =========================
   データ管理
========================= */

.data-management{
  margin-top:15px;
  padding-top:5px;
  border-top:1px solid #eee
}

.data-management h2{
  margin:0 0 4px;
  padding:0;
  border:none;
  font-size:11px;
  font-weight:normal;
  color:#999
}

.data-buttons{
  display:flex;
  gap:4px
}

.data-button{
  width:auto;
  height:24px;
  padding:0 7px;
  background:#f5f5f5;
  color:#777;
  border:1px solid #ddd;
  border-radius:3px;
  font-size:10px
}

#backupFile{
  display:none
}


/* =========================
   保存したコース
========================= */

.saved{
  margin-top:20px
}

.saved-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:18px 0 8px;
  border-bottom:1px solid #ddd;
  padding-bottom:5px
}

.saved-header h2{
  margin:0;
  border:none;
  padding:0
}

.sort-select{
  height:28px;
  padding:0 6px;
  border:1px solid #ccc;
  border-radius:3px;
  font-size:12px;
  background:#fff
}

.saved-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:6px 0;
  font-size:14px
}

.saved-item-info{
  flex:1;
  min-width:0;
  padding-right:8px
}

.saved-item-title{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-weight:bold
}

.saved-item-date{
  font-size:11px;
  color:#777;
  margin-top:2px
}

.saved-item-buttons{
  display:flex;
  gap:4px;
  flex-shrink:0
}

.saved-item-buttons button{
  height:28px;
  padding:0 8px;
  font-size:12px;
  background:#eee;
  color:#333
}

.saved-item-buttons .load{
  background:#e2e2e2
}

.saved-item-buttons .edit{
  background:#d5d5d5
}

.saved-item-buttons .del{
  background:#f2f2f2;
  color:#666
}

.no-result{
  font-size:13px;
  color:#888;
  padding:8px 0
}
</style>
</head>

<body>

<div class="box">

<h1>コースメニュー</h1>

<input
  id="searchKeyword"
  class="search-box"
  type="text"
  placeholder="キーワード検索（名前・料理名・日付）"
  oninput="displaySavedCourses()"
>

<input type="hidden" id="editingId" value="">

<div class="info-row">

  <div class="info-label">
    お客様のお名前
  </div>

  <input
    id="customerName"
    class="info-input"
    type="text"
    placeholder="名前"
  >

</div>

<h2>料理</h2>

<div id="foods"></div>

<div class="total">
  料理合計
  <span id="foodTotal">0</span>円
</div>

<button
  class="main-button"
  onclick="createMenu()"
>
  コースを作成
</button>

<div class="button-group">

  <button
    class="main-button save"
    onclick="saveCourse(false)"
  >
    新規保存
  </button>

  <button
    class="main-button save"
    onclick="saveCourse(true)"
  >
    上書き保存
  </button>

</div>

<div
  id="result"
  class="result"
  style="display:none"
></div>


<!-- データ管理 -->

<div class="data-management">

  <h2>データ管理</h2>

  <div class="data-buttons">

    <button
      class="data-button"
      onclick="backupData()"
    >
      バックアップ
    </button>

    <button
      class="data-button"
      onclick="document.getElementById('backupFile').click()"
    >
      復元
    </button>

  </div>

  <input
    type="file"
    id="backupFile"
    accept=".json,application/json"
    onchange="restoreData(event)"
  >

</div>


<!-- 保存したコース -->

<div class="saved">

  <div class="saved-header">

    <h2>保存したコース</h2>

    <select
      id="sortOrder"
      class="sort-select"
      onchange="displaySavedCourses()"
    >

      <option value="newest">
        新しい順（デフォルト）
      </option>

      <option value="oldest">
        古い順
      </option>

      <option value="name">
        名前順（五十音）
      </option>

    </select>

  </div>

  <div id="savedCourses"></div>

</div>

</div>


<script>

let foodCount = 0;


/* =========================
   料理追加
========================= */

function addFood(name = '', price = '') {

  foodCount++;

  const id = foodCount;

  const food =
    document.createElement('div');

  food.className = 'food';

  food.id = 'food' + id;

  food.innerHTML = `

    <div class="food-row">

      <span class="food-number"></span>

      <input
        type="text"
        class="food-name"
        placeholder="料理名"
        value="${escapeHtml(name)}"
      >

      <input
        type="number"
        class="food-price"
        placeholder="金額"
        min="0"
        value="${price}"
      >

      <button
        class="delete"
        onclick="deleteFood(${id})"
      >
        削除
      </button>

      <button
        class="insert"
        onclick="insertFoodAfter(${id})"
      >
        ＋
      </button>

    </div>
  `;

  document
    .getElementById('foods')
    .appendChild(food);

  food
    .querySelector('.food-price')
    .addEventListener(
      'input',
      updateFoodTotal
    );

  renumberFoods();

  updateFoodTotal();
}


/* =========================
   途中に料理追加
========================= */

function insertFoodAfter(id) {

  const current =
    document.getElementById(
      "food" + id
    );

  if (!current) return;

  foodCount++;

  const newId = foodCount;

  const food =
    document.createElement("div");

  food.className = "food";

  food.id = "food" + newId;

  food.innerHTML = `

    <div class="food-row">

      <span class="food-number"></span>

      <input
        type="text"
        class="food-name"
        placeholder="料理名"
      >

      <input
        type="number"
        class="food-price"
        placeholder="金額"
        min="0"
      >

      <button
        class="delete"
        onclick="deleteFood(${newId})"
      >
        削除
      </button>

      <button
        class="insert"
        onclick="insertFoodAfter(${newId})"
      >
        ＋
      </button>

    </div>
  `;

  current.after(food);

  food
    .querySelector(".food-price")
    .addEventListener(
      "input",
      updateFoodTotal
    );

  renumberFoods();

  updateFoodTotal();
}


/* =========================
   料理削除
========================= */

function deleteFood(id) {

  if (
    !confirm(
      'この料理を削除しますか？'
    )
  ) {
    return;
  }

  const food =
    document.getElementById(
      'food' + id
    );

  if (food) {

    food.remove();

    renumberFoods();

    updateFoodTotal();

  }
}


/* =========================
   料理番号
========================= */

function renumberFoods() {

  document
    .querySelectorAll('.food')
    .forEach(
      (food, index) => {

        food
          .querySelector(
            '.food-number'
          )
          .textContent =
          (index + 1) + '.';

      }
    );

}


/* =========================
   合計金額
========================= */

function getFoodTotal() {

  let total = 0;

  document
    .querySelectorAll('.food-price')
    .forEach(
      input => {

        total +=
          Number(input.value) || 0;

      }
    );

  return total;
}


function updateFoodTotal() {

  document
    .getElementById(
      'foodTotal'
    )
    .textContent =
    getFoodTotal().toLocaleString();

}


/* =========================
   日付
========================= */

function formatDate(date) {

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(2, '0');

  const d =
    String(
      date.getDate()
    ).padStart(2, '0');

  const hh =
    String(
      date.getHours()
    ).padStart(2, '0');

  const mm =
    String(
      date.getMinutes()
    ).padStart(2, '0');

  return `${y}/${m}/${d} ${hh}:${mm}`;
}


/* =========================
   コースデータ取得
========================= */

function getCourseData() {

  const foods = [];

  const names =
    document.querySelectorAll(
      '.food-name'
    );

  const prices =
    document.querySelectorAll(
      '.food-price'
    );

  for (
    let i = 0;
    i < names.length;
    i++
  ) {

    if (
      names[i].value.trim() !== ''
    ) {

      foods.push({

        name:
          names[i].value,

        price:
          Number(
            prices[i].value
          ) || 0

      });

    }

  }

  return {

    name:
      document
        .getElementById(
          'customerName'
        )
        .value,

    foods,

    updatedAt:
      formatDate(
        new Date()
      )

  };

}


/* =========================
   コース作成
========================= */

function createMenu() {

  const data =
    getCourseData();

  let html =
    '<b>' +
    (
      data.name
        ? data.name + ' 様'
        : '名前なし'
    ) +
    '</b><hr>';

  data.foods.forEach(
    (food, index) => {

      html +=
        (index + 1) +
        '. ' +
        escapeHtml(
          food.name
        ) +
        ' ' +
        food.price.toLocaleString() +
        '円<br>';

    }
  );

  document
    .getElementById(
      'result'
    )
    .innerHTML =
    html;

  document
    .getElementById(
      'result'
    )
    .style.display =
    'block';
}


/* =========================
   保存
========================= */

function saveCourse(
  isOverwrite = false
) {

  const data =
    getCourseData();

  let courses =
    JSON.parse(
      localStorage.getItem(
        'courseMenuData'
      )
    ) || [];

  const editingId =
    document
      .getElementById(
        'editingId'
      )
      .value;


  if (
    isOverwrite &&
    editingId
  ) {

    const index =
      courses.findIndex(
        c =>
          c.id ===
          Number(editingId)
      );

    if (index !== -1) {

      data.id =
        Number(editingId);

      courses[index] =
        data;

      alert(
        '上書き保存しました'
      );

    } else {

      data.id =
        Date.now();

      courses.push(data);

      alert(
        '新規保存しました'
      );

    }

  } else {

    data.id =
      Date.now();

    courses.push(data);

    document
      .getElementById(
        'editingId'
      )
      .value =
      data.id;

    alert(
      '新規保存しました'
    );

  }


  localStorage.setItem(
    'courseMenuData',
    JSON.stringify(
      courses
    )
  );

  displaySavedCourses();

}


/* =========================
   保存コース読込
========================= */

function loadCourseToForm(
  course
) {

  document
    .getElementById(
      'editingId'
    )
    .value =
    course.id;

  document
    .getElementById(
      'customerName'
    )
    .value =
    course.name || '';

  document
    .getElementById(
      'foods'
    )
    .innerHTML = '';

  foodCount = 0;


  if (
    course.foods &&
    course.foods.length > 0
  ) {

    course.foods.forEach(
      food => {

        addFood(
          food.name,
          food.price
        );

      }
    );

  } else {

    addFood();

  }

  updateFoodTotal();

}


/* =========================
   保存コース表示
========================= */

function displaySavedCourses() {

  const area =
    document.getElementById(
      'savedCourses'
    );

  const courses =
    JSON.parse(
      localStorage.getItem(
        'courseMenuData'
      )
    ) || [];

  const keyword =
    document
      .getElementById(
        'searchKeyword'
      )
      .value
      .trim()
      .toLowerCase();

  const sortOrder =
    document
      .getElementById(
        'sortOrder'
      )
      .value;

  area.innerHTML = '';


  let filtered =
    courses.filter(
      course =>

        keyword === '' ||

        String(
          course.name || ''
        )
        .toLowerCase()
        .includes(keyword) ||

        String(
          course.updatedAt || ''
        )
        .toLowerCase()
        .includes(keyword) ||

        (course.foods || [])
        .some(
          food =>
            String(
              food.name || ''
            )
            .toLowerCase()
            .includes(keyword)
        )
    );


  if (
    filtered.length === 0
  ) {

    area.innerHTML =
      '<div class="no-result">' +
      '該当するコースはありません。' +
      '</div>';

    return;

  }


  if (
    sortOrder === 'newest'
  ) {

    filtered.sort(
      (a, b) =>
        b.id - a.id
    );

  } else if (
    sortOrder === 'oldest'
  ) {

    filtered.sort(
      (a, b) =>
        a.id - b.id
    );

  } else if (
    sortOrder === 'name'
  ) {

    filtered.sort(
      (a, b) =>
        (a.name || '')
        .localeCompare(
          b.name || '',
          'ja'
        )
    );

  }


  filtered.forEach(
    course => {

      const div =
        document.createElement(
          'div'
        );

      div.className =
        'saved-item';


      const infoDiv =
        document.createElement(
          'div'
        );

      infoDiv.className =
        'saved-item-info';


      const titleDiv =
        document.createElement(
          'div'
        );

      titleDiv.className =
        'saved-item-title';

      titleDiv.textContent =
        (
          course.name
            ? course.name + ' 様'
            : '名称未設定'
        );


      const dateDiv =
        document.createElement(
          'div'
        );

      dateDiv.className =
        'saved-item-date';

      dateDiv.textContent =
        course.updatedAt
          ? `保存日: ${course.updatedAt}`
          : '';


      infoDiv.appendChild(
        titleDiv
      );

      if (
        course.updatedAt
      ) {

        infoDiv.appendChild(
          dateDiv
        );

      }


      const btnGroup =
        document.createElement(
          'div'
        );

      btnGroup.className =
        'saved-item-buttons';


      const loadResultBtn =
        document.createElement(
          'button'
        );

      loadResultBtn.className =
        'load';

      loadResultBtn.textContent =
        '表示';

      loadResultBtn.onclick =
        () =>
          createSavedResult(
            course
          );


      const loadFormBtn =
        document.createElement(
          'button'
        );

      loadFormBtn.className =
        'edit';

      loadFormBtn.textContent =
        '読込';

      loadFormBtn.onclick =
        () =>
          loadCourseToForm(
            course
          );


      const delBtn =
        document.createElement(
          'button'
        );

      delBtn.className =
        'del';

      delBtn.textContent =
        '削除';

      delBtn.onclick =
        () =>
          deleteCourse(
            course.id
          );


      btnGroup.appendChild(
        loadResultBtn
      );

      btnGroup.appendChild(
        loadFormBtn
      );

      btnGroup.appendChild(
        delBtn
      );


      div.appendChild(
        infoDiv
      );

      div.appendChild(
        btnGroup
      );

      area.appendChild(
        div
      );

    }
  );

}


/* =========================
   保存コース表示
========================= */

function createSavedResult(
  course
) {

  let html =
    '<b>' +
    (
      course.name
        ? course.name + ' 様'
        : '名称未設定'
    ) +
    '</b>';


  if (
    course.updatedAt
  ) {

    html +=
      `<span style="font-size:12px;color:#666;margin-left:8px;">` +
      `(${course.updatedAt})` +
      `</span>`;

  }


  html += '<hr>';


  (course.foods || [])
    .forEach(
      (food, index) => {

        html +=
          (index + 1) +
          '. ' +
          escapeHtml(
            food.name
          ) +
          ' ' +
          Number(
            food.price || 0
          ).toLocaleString() +
          '円<br>';

      }
    );


  document
    .getElementById(
      'result'
    )
    .innerHTML =
    html;

  document
    .getElementById(
      'result'
    )
    .style.display =
    'block';

}


/* =========================
   保存コース削除
========================= */

function deleteCourse(id) {

  if (
    !confirm(
      'このコースデータを削除しますか？'
    )
  ) {

    return;

  }


  let courses =
    JSON.parse(
      localStorage.getItem(
        'courseMenuData'
      )
    ) || [];


  courses =
    courses.filter(
      course =>
        course.id !== id
    );


  localStorage.setItem(
    'courseMenuData',
    JSON.stringify(
      courses
    )
  );


  if (
    document
      .getElementById(
        'editingId'
      )
      .value ===
    String(id)
  ) {

    document
      .getElementById(
        'editingId'
      )
      .value = '';

  }


  displaySavedCourses();

}


/* =========================
   バックアップ
========================= */

function backupData() {

  const courses =
    JSON.parse(
      localStorage.getItem(
        'courseMenuData'
      )
    ) || [];


  if (
    courses.length === 0
  ) {

    alert(
      'バックアップするデータがありません。'
    );

    return;

  }


  const backup = {

    appName:
      'コースメニュー',

    version:
      1,

    backupDate:
      formatDate(
        new Date()
      ),

    courses:
      courses

  };


  const json =
    JSON.stringify(
      backup,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          'application/json'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  const now =
    new Date();


  const filename =
    'コースメニュー_バックアップ_' +
    now.getFullYear() +
    String(
      now.getMonth() + 1
    ).padStart(2, '0') +
    String(
      now.getDate()
    ).padStart(2, '0') +
    '.json';


  a.href = url;

  a.download =
    filename;

  document
    .body
    .appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );


  alert(
    'バックアップファイルを保存しました。'
  );

}


/* =========================
   復元
========================= */

function restoreData(event) {

  const file =
    event.target.files[0];

  if (!file) return;


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const backup =
          JSON.parse(
            e.target.result
          );


        if (
          !backup ||
          !Array.isArray(
            backup.courses
          )
        ) {

          throw new Error(
            'バックアップデータが正しくありません。'
          );

        }


        if (
          !confirm(
            '現在保存されているコースデータを、バックアップデータで置き換えますか？'
          )
        ) {

          event.target.value = '';

          return;

        }


        localStorage.setItem(
          'courseMenuData',
          JSON.stringify(
            backup.courses
          )
        );


        document
          .getElementById(
            'editingId'
          )
          .value = '';


        displaySavedCourses();


        alert(
          'データを復元しました。'
        );


      } catch(error) {

        alert(
          'バックアップファイルを読み込めませんでした。'
        );

      }


      event.target.value = '';

    };


  reader.readAsText(
    file
  );
