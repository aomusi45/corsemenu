```html
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>コースメニュー</title>

<style>

*{
  box-sizing:border-box;
}

body{
  font-family:sans-serif;
  margin:0;
  padding:10px;
  background:#fff;
  color:#222;
}

.box{
  max-width:600px;
  margin:auto;
}

h1{
  font-size:22px;
  text-align:center;
  margin:5px 0 15px;
}

input{
  font-size:16px;
  padding:8px;
  border:1px solid #ccc;
  border-radius:4px;
  background:#fff;
}

.customer{
  width:100%;
  margin-bottom:10px;
}

.food-row{
  display:flex;
  align-items:center;
  gap:5px;
  margin-bottom:6px;
}

.plus-button{
  width:25px;
  height:25px;
  min-width:25px;
  padding:0;
  border:1px solid #bbb;
  background:#f5f5f5;
  border-radius:4px;
  font-size:16px;
  line-height:23px;
}

.food-name{
  flex:1;
  min-width:0;
}

.food-price{
  width:90px;
  text-align:right;
}

.delete-button{
  width:28px;
  height:32px;
  padding:0;
  border:1px solid #ccc;
  background:#f5f5f5;
  border-radius:4px;
  font-size:14px;
}

.total-box{
  margin-top:15px;
  padding:12px;
  border-top:2px solid #222;
  border-bottom:2px solid #222;
  text-align:right;
  font-size:22px;
  font-weight:bold;
}

.total-label{
  margin-right:8px;
}

.data-management{
  margin-top:12px;
  padding-top:4px;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  gap:5px;
  height:28px;
}

.data-management-title{
  font-size:9px;
  color:#aaa;
  margin:0;
  padding:0;
  white-space:nowrap;
}

.data-buttons{
  display:flex;
  align-items:center;
  gap:3px;
  margin:0;
  padding:0;
}

.data-button{
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  width:auto !important;
  min-width:0 !important;
  height:20px !important;
  min-height:20px !important;
  margin:0 !important;
  padding:0 5px !important;
  border:1px solid #ddd !important;
  border-radius:2px !important;
  background:#f7f7f7 !important;
  color:#888 !important;
  font-family:sans-serif;
  font-size:9px !important;
  line-height:20px !important;
  font-weight:normal !important;
}

.data-button:active{
  background:#ddd !important;
}

#backupFile{
  display:none !important;
}

</style>

</head>

<body>

<div class="box">

<h1>コースメニュー</h1>

<input
  type="text"
  id="customerName"
  class="customer"
  placeholder="お客様名"
>

<div id="foodList"></div>

<div class="total-box">

<span class="total-label">合計</span>

<span id="totalPrice">0</span>円

</div>


<!-- データ管理 -->

<div class="data-management">

<span class="data-management-title">
データ
</span>

<div class="data-buttons">

<button
  type="button"
  class="data-button"
  onclick="backupData()"
>
バックアップ
</button>

<button
  type="button"
  class="data-button"
  onclick="document.getElementById('backupFile').click()"
>
復元
</button>

</div>

<input
  type="file"
  id="backupFile"
  accept=".json,application/json"
  onchange="restoreData(event)"
>

</div>

</div>


<script>

/* =========================
   料理データ
========================= */

const foodList =
  document.getElementById(
    'foodList'
  );

const customerName =
  document.getElementById(
    'customerName'
  );

const totalPrice =
  document.getElementById(
    'totalPrice'
  );


/* =========================
   料理を追加
========================= */

function addFood(
  position = null,
  name = '',
  price = ''
){

  const row =
    document.createElement(
      'div'
    );

  row.className =
    'food-row';


  /* ＋ボタン */

  const plus =
    document.createElement(
      'button'
    );

  plus.type =
    'button';

  plus.className =
    'plus-button';

  plus.textContent =
    '＋';

  plus.onclick =
    function(){

      const newRow =
        createFoodRow();

      row.parentNode.insertBefore(
        newRow,
        row.nextSibling
      );

      updateTotal();

    };


  /* 料理名 */

  const nameInput =
    document.createElement(
      'input'
    );

  nameInput.type =
    'text';

  nameInput.className =
    'food-name';

  nameInput.placeholder =
    '料理名';

  nameInput.value =
    name;


  /* 金額 */

  const priceInput =
    document.createElement(
      'input'
    );

  priceInput.type =
    'number';

  priceInput.className =
    'food-price';

  priceInput.placeholder =
    '金額';

  priceInput.inputMode =
    'numeric';

  priceInput.value =
    price;


  /* 削除 */

  const deleteButton =
    document.createElement(
      'button'
    );

  deleteButton.type =
    'button';

  deleteButton.className =
    'delete-button';

  deleteButton.textContent =
    '×';

  deleteButton.onclick =
    function(){

      row.remove();

      updateTotal();

    };


  row.appendChild(
    plus
  );

  row.appendChild(
    nameInput
  );

  row.appendChild(
    priceInput
  );

  row.appendChild(
    deleteButton
  );


  if(
    position === null
  ){

    foodList.appendChild(
      row
    );

  }else{

    foodList.insertBefore(
      row,
      foodList.children[
        position
      ]
    );

  }


  nameInput.addEventListener(
    'input',
    updateTotal
  );

  priceInput.addEventListener(
    'input',
    updateTotal
  );

  return row;

}


/* =========================
   料理行を作成
========================= */

function createFoodRow(){

  return addFood();

}


/* =========================
   合計金額
========================= */

function updateTotal(){

  let total = 0;

  document
    .querySelectorAll(
      '.food-price'
    )
    .forEach(
      function(input){

        total +=
          Number(
            input.value
          ) || 0;

      }
    );

  totalPrice.textContent =
    total.toLocaleString();

}


/* =========================
   現在の内容を取得
========================= */

function getCurrentData(){

  const foods = [];

  document
    .querySelectorAll(
      '.food-row'
    )
    .forEach(
      function(row){

        const name =
          row.querySelector(
            '.food-name'
          ).value;

        const price =
          row.querySelector(
            '.food-price'
          ).value;

        foods.push({

          name:name,

          price:price

        });

      }
    );


  return {

    appName:
      'コースメニュー',

    version:
      1,

    backupDate:
      new Date().toISOString(),

    customerName:
      customerName.value,

    foods:
      foods

  };

}


/* =========================
   バックアップ
========================= */

function backupData(){

  const data =
    getCurrentData();


  const json =
    JSON.stringify(
      data,
      null,
      2
    );


  const blob =
    new Blob(
      [json],
      {
        type:
          'application/json'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  const now =
    new Date();


  const filename =
    'コースメニュー_バックアップ_' +

    now.getFullYear() +

    String(
      now.getMonth() + 1
    ).padStart(
      2,
      '0'
    ) +

    String(
      now.getDate()
    ).padStart(
      2,
      '0'
    ) +

    '.json';


  a.href =
    url;

  a.download =
    filename;


  document
    .body
    .appendChild(
      a
    );


  a.click();

  a.remove();


  URL.revokeObjectURL(
    url
  );

}


/* =========================
   復元
========================= */

function restoreData(
  event
){

  const file =
    event.target.files[0];


  if(
    !file
  ){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e){

      try{

        const data =
          JSON.parse(
            e.target.result
          );


        if(
          !data ||
          !Array.isArray(
            data.foods
          )
        ){

          throw new Error();

        }


        customerName.value =
          data.customerName || '';


        foodList.innerHTML =
          '';


        if(
          data.foods.length === 0
        ){

          addFood();

        }else{

          data.foods.forEach(
            function(food){

              addFood(
                null,
                food.name || '',
                food.price || ''
              );

            }
          );

        }


        updateTotal();


        alert(
          'データを復元しました。'
        );


      }catch(error){

        alert(
          'バックアップファイルを読み込めませんでした。'
        );

      }


      event.target.value =
        '';

    };


  reader.readAsText(
    file
  );

}


/* =========================
   初期表示
========================= */

addFood();

updateTotal();


/* =========================
   お客様名の保存
========================= */

customerName.addEventListener(
  'input',
  function(){

    try{

      localStorage.setItem(
        'courseMenuCurrent',
        JSON.stringify(
          getCurrentData()
        )
      );

    }catch(error){}

  }
);


/* =========================
   自動保存
========================= */

document.addEventListener(
  'input',
  function(){

    try{

      localStorage.setItem(
        'courseMenuCurrent',
        JSON.stringify(
          getCurrentData()
        )
      );

    }catch(error){}

  }
);


/* =========================
   起動時に前回の内容を復元
========================= */

window.addEventListener(
  'load',
  function(){

    try{

      const saved =
        localStorage.getItem(
          'courseMenuCurrent'
        );


      if(
        !saved
      ){

        return;

      }


      const data =
        JSON.parse(
          saved
        );


      if(
        !data ||
        !Array.isArray(
          data.foods
        )
      ){

        return;

      }


      if(
        data.customerName ||
        data.foods.some(
          function(food){

            return (
              food.name ||
              food.price
            );

          }
        )
      ){

        customerName.value =
          data.customerName || '';


        foodList.innerHTML =
          '';


        data.foods.forEach(
          function(food){

            addFood(
              null,
              food.name || '',
              food.price || ''
            );

          }
        );


        updateTotal();

      }

    }catch(error){}

  }
);

</script>

</body>

</html>
